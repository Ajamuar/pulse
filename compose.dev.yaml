# Postgres alone, for `pnpm dev` and the e2e tests: docker compose -f compose.dev.yaml up -d
# DATABASE_URL defaults to postgres://pulse:pulse@localhost:5432/pulse when unset.
services:
  db:
    image: postgres:18-alpine
    container_name: pulse-dev-db
    environment:
      POSTGRES_USER: pulse
      POSTGRES_DB: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pulse-dev-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pulse-dev-pg:
