# Every pull request and every push to main runs the same checks AGENTS.md asks for before a commit.
# The job names ("checks", "e2e") are the required status checks in .github/rulesets/main.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repo, and fork PRs get no secrets anyway.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # schema.ts and drizzle/ agree: generating from the schema must write nothing (about 3 s).
      - name: migration drift
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            git status --porcelain drizzle/
            echo "::error::src/server/db/schema.ts changed without a migration: run pnpm db:generate and commit drizzle/"
            exit 1
          fi
      - run: pnpm test

  # Runs beside `checks`, not after it: the two are independent and e2e is the long one.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      # Demo mode against a production build on its own port and throwaway Postgres database (playwright.config.ts);
      # no secrets needed. CI runs the phone (361) and laptop (1440) widths, plus the onboarding journey on its
      # profile-less second server; local `pnpm e2e` sweeps all five.
      - run: pnpm e2e --project=setup --project=361 --project=1440 --project=onboarding
        env:
          CI: "true"
          E2E_PROD: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
