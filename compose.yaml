# One container; the database lives in the pulse-data volume. See docs/setup.md.
services:
  pulse:
    build: .
    image: pulse:latest
    container_name: pulse
    restart: unless-stopped
    env_file: .env
    # Uses ~100-150 MB. The V8 heap is 50% of this limit (Dockerfile), so raising it grows the heap too.
    mem_limit: 384m
    volumes:
      - pulse-data:/app/data
    ports:
      # Loopback only: put a tunnel or an HTTPS reverse proxy on this machine in front of it.
      - "127.0.0.1:3000:3000"

volumes:
  pulse-data:
